<VirtualHost _default_:443>
ServerName rspamd.robots.org.uk

ErrorLog logs/rspamd.robots.org.uk/ssl_error_log
TransferLog logs/rspamd.robots.org.uk/ssl_access_log
LogLevel warn

SSLEngine on
SSLHonorCipherOrder on
SSLCipherSuite PROFILE=SYSTEM
SSLProxyCipherSuite PROFILE=SYSTEM
#SSLCertificateFile /etc/pki/tls/rspamd.crt
#SSLCertificateKeyFile /etc/pki/tls/private/rspamd.key
SSLCertificateFile /etc/pki/tls/certs/localhost.crt
SSLCertificateKeyFile /etc/pki/tls/private/localhost.key
CustomLog logs/dmarc-reports.robots.org.uk/ssl_request_log \
          "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

<Location />
Include conf.d/gssapi.inc
Require user sam
</Location>

ProxyPass / http://localhost:11334/
ProxyPassReverse / http://localhost:11334/
RequestHeader set "X-Forwarded-Proto" expr=%{REQUEST_SCHEME}
# X-Forwarded-For is added by ProxyAddHeaders which is enabled by default

</VirtualHost>
# vim: ft=apache
